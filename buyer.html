<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Plan House - منصة العقارات (المشتري)</title>
  <style>
    :root {
      --brand-blue: #0A2540;
      --brand-accent: #00D4B2;
      --map-bg: #E5E3DF;
      --map-text: #202124;
    }

    body {
      font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
      background-color: var(--map-bg);
      color: var(--map-text);
      margin: 0;
      padding: 20px;
    }

    .app-header {
      background-color: var(--brand-blue);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-bottom: 4px solid var(--brand-accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid #DADCE0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.15);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #DADCE0;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      color: var(--map-text);
    }

    .properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .property-item {
      border: 1px solid #E8EAED;
      border-radius: 8px;
      padding: 15px;
      background: #FFFFFF;
      border-top: 4px solid var(--brand-blue);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* معرض الصور */
    .image-gallery {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      margin: 10px 0;
      padding-bottom: 5px;
    }

    .image-gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    video {
      width: 100%;
      border-radius: 6px;
      margin-top: 8px;
    }

    .btn-whatsapp {
      display: block;
      text-align: center;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 10px;
    }

    .btn-social {
      display: block;
      text-align: center;
      background-color: var(--brand-blue);
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- غلاف الموقع -->
  <div class="app-header">
    <h1 style="margin:0; font-size:22px;">Plan House | بلان هاوس</h1>
    <span>تصفح العقارات المتاحة</span>
  </div>

  <!-- قسم البحث والفلترة -->
  <div class="card">
    <h3 style="color: var(--brand-blue); margin-top:0;">البحث والفلترة</h3>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="searchInput" onkeyup="filterProperties()" placeholder="🔍 ابحث اسم الشارع، الحارة، أو المنطقة...">
      <input type="number" id="maxPriceInput" onkeyup="filterProperties()" placeholder="💲 حد أقصى للسعر...">
    </div>
  </div>

  <!-- عرض العقارات -->
  <div class="card">
    <h3 style="color: var(--brand-blue); margin-top:0;">قائمة العقارات المعروضة</h3>
    <div id="propertiesList" class="properties-grid"></div>
  </div>

  <script>
    let properties = JSON.parse(localStorage.getItem('plan_house_db')) || [];

    window.onload = function() {
      displayProperties(properties);
    };

    function displayProperties(data) {
      const listDiv = document.getElementById('propertiesList');
      listDiv.innerHTML = '';

      if (data.length === 0) {
        listDiv.innerHTML = '<p style="color:#70757A;">لا توجد عقارات مطابقة حالياً.</p>';
        return;
      }

      data.forEach(item => {
        // تجهيز معرض الصور
        let imgsHTML = '';
        if (item.images && item.images.length > 0) {
          imgsHTML = `<div class="image-gallery">` + 
            item.images.map(img => `<img src="${img}" alt="صورة العقار">`).join('') + 
            `</div>`;
        }

        // تجهيز الفيديو
        let videoHTML = item.video ? `<video src="${item.video}" controls></video>` : '';

        // رابط التواصل الاجتماعي
        let socialHTML = item.socialLink ? 
          `<a href="${item.socialLink}" target="_blank" class="btn-social">🌐 زيارة صفحة التواصل الاجتماعي</a>` : '';

        // رابط الواتساب الجاهز مع تفاصيل العقار
        const msg = encodeURIComponent(`مرحباً، أنا مهتم بعقار: (${item.title})\n📍 الموقع: ${item.street}\n💰 السعر: ${item.price}`);
        const waLink = `https://wa.me/${item.whatsapp.replace(/[^0-9]/g, '')}?text=${msg}`;

        listDiv.innerHTML += `
          <div class="property-item">
            <div>
              <h3 style="margin:0 0 8px 0; color:var(--brand-blue);">${item.title}</h3>
              <p style="margin:4px 0; font-size:14px; color:#5F6368;">📍 <strong>الموقع:</strong> ${item.street}</p>
              <p style="margin:4px 0; font-size:16px; font-weight:bold; color:var(--brand-blue);">💰 <strong>السعر:</strong> ${item.price.toLocaleString()} $</p>
              ${item.details ? `<p style="margin:8px 0; font-size:13px; color:#3C4043;">📝 ${item.details}</p>` : ''}
              
              ${imgsHTML}
              ${videoHTML}
            </div>

            <div>
              ${socialHTML}
              <a href="${waLink}" target="_blank" class="btn-whatsapp">💬 تواصل مع المالك عبر الواتساب</a>
            </div>
          </div>
        `;
      });
    }

    function filterProperties() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const maxPrice = parseFloat(document.getElementById('maxPriceInput').value) || Infinity;

      const filtered = properties.filter(item => {
        const matchesStreet = item.street.toLowerCase().includes(searchText) || item.title.toLowerCase().includes(searchText);
        const matchesPrice = item.price <= maxPrice;
        return matchesStreet && matchesPrice;
      });

      displayProperties(filtered);
    }
  </script>
</body>
</html>

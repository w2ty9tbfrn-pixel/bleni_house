<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - بلان هاوس سوريا</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; direction: rtl; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
        .form-card { flex: 1; min-width: 320px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .map-card { flex: 1.5; min-width: 350px; height: 600px; background: white; border-radius: 12px; overflow: hidden; }
        #adminMap { width: 100%; height: 100%; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .secret-section { background: #fef2f2; border: 1px dashed #ef4444; padding: 12px; border-radius: 8px; margin-top: 15px; }
        .secret-title { color: #dc2626; font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; }
        .btn-submit { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<h2>🔒 لوحة المالك (بلان هاوس) - تحديد العقار في سوريا</h2>
<p style="color: #64748b; margin-bottom: 20px;">انقر فوق البيت/الأرض على خريطة القمر الصناعي لتحديد موقع العقار بدقة.</p>

<div class="container">
    <div class="form-card">
        <h3>بيانات العقار الجديدة</h3>
        <hr style="margin: 10px 0;"><br>

        <div class="input-group">
            <label>رقم العقار المرجعي:</label>
            <input type="text" id="propId" placeholder="مثلاً: SY-102">
        </div>

        <div class="input-group">
            <label>عنوان العقار:</label>
            <input type="text" id="title" placeholder="شقة، فيلا، أرض...">
        </div>

        <div class="input-group">
            <label>نوع العقار:</label>
            <select id="type">
                <option>شقة / فيلا</option>
                <option>أرض</option>
                <option>محل تجاري</option>
                <option>مزرعة</option>
            </select>
        </div>

        <div class="input-group">
            <label>السعر المعروض للعموم:</label>
            <input type="text" id="price" placeholder="مثال: 50,000 $">
        </div>

        <div class="input-group">
            <label>المساحة والمواصفات:</label>
            <input type="text" id="specs" placeholder="المساحة، الغرف...">
        </div>

        <div class="input-group">
            <label>الإحداثيات (تحدد بالنقر على الخريطة):</label>
            <input type="text" id="coords" readonly placeholder="اضغط على الخريطة لتحديد المكان">
        </div>

        <div class="secret-section">
            <div class="secret-title">🔒 بيانات سرية (تظهر لك فقط):</div>
            <div class="input-group">
                <label>اسم المالك الأصلي:</label>
                <input type="text" id="ownerName" placeholder="اسم صاحب العقار">
            </div>
            <div class="input-group">
                <label>رقم هاتف المالك الأصلي:</label>
                <input type="text" id="ownerPhone" placeholder="09xxxxxxxx">
            </div>
            <div class="input-group">
                <label>العمولة / أرقام خاصة:</label>
                <input type="text" id="commission" placeholder="تفاصيل العمولة والصافي">
            </div>
        </div>

        <button class="btn-submit" onclick="saveProperty()">حفظ ونشر العقار</button>
    </div>

    <div class="map-card">
        <div id="adminMap"></div>
    </div>
</div>

<script>
    // التمركز على سوريا بالصور الجوية
    const adminMap = L.map('adminMap').setView([33.5138, 36.2765], 13);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(adminMap);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', { subdomains: 'abcd' }).addTo(adminMap);

    let selectedMarker = null;

    adminMap.on('click', function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        if (selectedMarker) adminMap.removeLayer(selectedMarker);

        selectedMarker = L.marker([lat, lng]).addTo(adminMap);
        document.getElementById('coords').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    });

    function saveProperty() {
        alert('تم حفظ العقار بنجاح وسيظهر للعملاء على الخريطة!');
    }
</script>
</body>
</html>

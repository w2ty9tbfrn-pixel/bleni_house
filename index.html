<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلان هاوس - خريطة العقارات في سوريا</title>
    <!-- مكتبة الخرائط Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* شريط العنوان */
        .header-bar {
            position: absolute; top: 15px; right: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center;
        }
        .header-bar h1 { font-size: 1.1rem; color: #0f172a; font-weight: bold; }
        
        /* النافذة المنزلقة للتفاصيل */
        .property-drawer {
            position: absolute; bottom: -100%; left: 0; right: 0; z-index: 1001;
            background: #fff; border-radius: 20px 20px 0 0; padding: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.3); transition: bottom 0.4s ease; max-height: 80vh; overflow-y: auto;
        }
        .property-drawer.active { bottom: 0; }
        .close-btn { float: left; font-size: 1.5rem; cursor: pointer; color: #64748b; }
        .property-title { font-size: 1.2rem; color: #0f172a; margin-bottom: 8px; font-weight: bold; }
        .property-price { font-size: 1.2rem; color: #16a34a; font-weight: bold; margin-bottom: 12px; }
        .property-specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .spec-item { font-size: 0.9rem; color: #334155; }
        .video-container { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .video-container iframe { width: 100%; height: 200px; border: none; }
        .whatsapp-btn {
            display: block; width: 100%; background: #25D366; color: white; text-align: center;
            padding: 12px; border-radius: 10px; font-weight: bold; text-decoration: none; font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🏠 بلان هاوس - عقارات سوريا</h1>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- نافذة تفاصيل العقار -->
    <div class="property-drawer" id="propertyDrawer">
        <span class="close-btn" onclick="closeDrawer()">&times;</span>
        <div class="property-title" id="propTitle">رقم العقار: REF-101</div>
        <div class="property-price" id="propPrice">00,000 $</div>
        
        <div class="video-container" id="videoBox"></div>

        <div class="property-specs">
            <div class="spec-item">📐 <b>المساحة:</b> <span id="propArea">-</span></div>
            <div class="spec-item">🏷️ <b>النوع:</b> <span id="propType">-</span></div>
            <div class="spec-item">🚪 <b>التقسيم:</b> <span id="propRooms">-</span></div>
            <div class="spec-item">📍 <b>المنطقة:</b> <span id="propLocation">-</span></div>
        </div>

        <p id="propDescription" style="font-size:0.9rem; color:#475569; margin-bottom:15px;"></p>

        <a href="#" id="whatsappBtn" target="_blank" class="whatsapp-btn">💬 تواصل عبر الواتساب للاستفسار</a>
    </div>

    <script>
        // 1. مركز الخريطة على دمشق / سوريا بشكل افتراضي وبمستوى تكبير واضح
        const map = L.map('map').setView([33.5138, 36.2765], 13);

        // 2. استخدام خريطة القمر الصناعي (Satellite) لإظهار البيوت والمباني بدقة
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // إضافة اسماء الشوارع والمناطق فوق القمر الصناعي
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const MY_OFFICE_WHATSAPP = "963900000000"; // رقم الواتساب الخاص بك

        // عقارات تجريبية في سوريا
        const properties = [
            {
                id: "SY-101",
                title: "شقة سكنية مميزة",
                type: "شقة",
                price: "45,000 $",
                area: "150 م²",
                rooms: "3 غرف وصالون",
                location: "دمشق - المزة",
                lat: 33.5020, lng: 36.2480,
                video: "",
                description: "شقة إكساء سوبر ديلوكس قريبة من جميع الخدمات."
            }
        ];

        properties.forEach(prop => {
            const marker = L.marker([prop.lat, prop.lng]).addTo(map);
            marker.on('click', () => openDrawer(prop));
        });

        function openDrawer(prop) {
            document.getElementById('propTitle').innerText = prop.title + " (" + prop.id + ")";
            document.getElementById('propPrice').innerText = prop.price;
            document.getElementById('propArea').innerText = prop.area;
            document.getElementById('propType').innerText = prop.type;
            document.getElementById('propRooms').innerText = prop.rooms;
            document.getElementById('propLocation').innerText = prop.location;
            document.getElementById('propDescription').innerText = prop.description;

            const videoBox = document.getElementById('videoBox');
            if(prop.video) {
                videoBox.innerHTML = `<iframe src="${prop.video}" allowfullscreen></iframe>`;
            } else {
                videoBox.innerHTML = ``;
            }

            const message = encodeURIComponent(`مرحباً بلان هاوس، أود الاستفسار عن العقار رقم: ${prop.id} - ${prop.title}`);
            document.getElementById('whatsappBtn').href = `https://wa.me/${MY_OFFICE_WHATSAPP}?text=${message}`;

            document.getElementById('propertyDrawer').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('propertyDrawer').classList.remove('active');
        }
    </script>
</body>
</html>
